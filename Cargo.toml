[package]
name = "patternkit"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["compilers", "algorithms"]
edition = "2021"
keywords = ["pattern-matching", "exhaustiveness", "compiler", "typechecker"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/patternkit"
description = "Maranget's matrix algorithm for pattern match exhaustiveness and reachability"

[dependencies]

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "splitting"
path = "examples/splitting.rs"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
